[project]
name = "hanaro"
version = "0.0.0"
description = "..a non-invasive `logging` configurator."
keywords = ["logging", "configuration", "appsettings2", "async"]
authors = [
    { name="Shaun Wilson", email="mrshaunwilson@msn.com" }
]
readme = "README.md"
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python"
]
requires-python = ">=3.11"
dependencies = [
    "appsettings2 (>=2.0.1)"
]

[project.optional-dependencies]
dev = [
    "coverage",
    "flake8",
    "flake8-pyproject",
    "mypy",
    "pep8-naming",
    "punit (>=1.4.0)",
    "twine"
]
bidi = [
    "python-bidi"
]

[project.urls]
Documentation = "https://hanaro.readthedocs.io/"
Homepage = "https://github.com/wilson0x4d/hanaro"
Repository = "https://github.com/wilson0x4d/hanaro.git"

[build-system]
requires = ["setuptools", "twine"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "docs",
    "tests",
    "tests.*"
]

[tool.setuptools.package-data]
"hanaro" = ["py.typed", "SKILL.md"]

[tool.flake8]
max-line-length = 120
ignore = ["D100","E501"]
